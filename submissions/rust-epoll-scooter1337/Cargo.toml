[package]
name = "twelve-rust-poll"
version = "0.1.0"
edition = "2024"
build = "build.rs"
[features]
default = ["sqlite-pgo"]
sqlite-pgo = []
[dependencies]
libc = "=0.2.183"
httparse = "=1.10.1"
memchr = "=2.8.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["raw_value"] }
itoa = "=1.0.18"
base64 = "=0.22.1"
sha2 = "=0.10.9"
hmac = "=0.12.1"
[build-dependencies]
cc = "=1.2.56"
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
